    <!-- Flowing Mane -->
    <path d="M100 52 C70 50, 50 75, 55 105 C60 135, 85 155, 100 158 C115 155, 140 135, 145 105 C150 75, 130 50, 100 52 Z" stroke-dasharray="80 3" />
    <path d="M65 78 C52 90, 55 120, 75 138" />
