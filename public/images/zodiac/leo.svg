    <circle cx="88" cy="98" r="2.2" fill="#17202D" />
    <circle cx="112" cy="98" r="2.2" fill="#17202D" />
    
    <!-- Ears -->
    <path d="M72 72 C65 62, 78 55, 82 68" />
    <path d="M128 72 C135 62, 122 55, 118 68" />

