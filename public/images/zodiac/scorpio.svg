<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Soft pastel lavender/violet watercolor shape -->
  <path d="M45 95 C30 45, 90 25, 145 40 C175 65, 165 140, 125 165 C65 175, 40 135, 50 95 Z" fill="#E1BEE7" opacity="0.65" />
  
  <!-- Fine dark ink line-art Scorpion -->
  <g stroke="#17202D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Segmented Body -->
    <ellipse cx="100" cy="115" rx="14" ry="22" />
    <path d="M92 105 H108 M90 115 H110 M92 125 H108" />

    <!-- Claws -->
    <path d="M92 100 C75 90, 60 70, 75 55 C88 65, 85 85, 95 95" />
    <path d="M108 100 C125 90, 140 70, 125 55 C112 65, 115 85, 105 95" />

    <!-- Arched Stinger Tail -->
    <path d="M100 137 C100 155, 120 162, 130 150 C140 138, 128 122, 132 110 C135 100, 148 105, 142 95" />
    <polygon points="142,95 148,90 144,98" fill="#17202D" />

    <!-- Legs -->
    <path d="M88 110 C70 112, 65 125, 75 130" />
    <path d="M88 120 C72 125, 68 138, 78 142" />
    <path d="M112 110 C130 112, 135 125, 125 130" />
  </g>
</svg>
