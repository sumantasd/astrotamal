<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Soft pastel lavender/blue watercolor shape -->
  <path d="M45 95 C30 45, 90 25, 145 40 C175 65, 165 140, 125 165 C65 175, 40 135, 50 95 Z" fill="#CFD8DC" opacity="0.65" />
  
  <!-- Fine dark ink line-art Two Fish -->
  <g stroke="#17202D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Fish (Swimming Left to Right) -->
    <path d="M50 82 C65 65, 115 65, 135 82 C115 98, 65 98, 50 82 Z" />
    <path d="M135 82 L152 72 L146 82 L152 92 Z" fill="#17202D" />
    <circle cx="65" cy="78" r="2" fill="#17202D" />
    <path d="M80 75 Q 90 82 100 75" />

    <!-- Bottom Fish (Swimming Right to Left) -->
    <path d="M150 125 C135 142, 85 142, 65 125 C85 108, 135 108, 150 125 Z" />
    <path d="M65 125 L48 115 L54 125 L48 135 Z" fill="#17202D" />
    <circle cx="135" cy="129" r="2" fill="#17202D" />
    <path d="M120 132 Q 110 125 100 132" />

    <!-- Connecting Ribbon / Stream -->
    <path d="M100 85 L100 120" stroke-dasharray="2 3" stroke-width="1.8" />
  </g>
</svg>
